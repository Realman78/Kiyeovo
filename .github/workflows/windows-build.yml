name: Windows Build

on:
  push:
    branches:
      - feature/windows-support
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Download bundled Tor (win32-x64)
        shell: bash
        run: bash scripts/download-tor.sh win32-x64

      - run: npm run build

      - run: npm run transpile:electron

      - name: Run unit tests
        run: npm run test:unit

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows installers
        env:
          # electron-builder invokes @electron/rebuild, which falls back to a
          # from-source node-gyp build for native modules with no prebuilt
          # binary for this Electron ABI (e.g. classic-level). node-gyp's own
          # Visual Studio auto-detection (find-visualstudio.js) can fail to
          # locate the runner's VS Build Tools even though they're installed,
          # so ilammy/msvc-dev-cmd above sets up the VC environment directly
          # and this pins the MSVS version node-gyp should target as a
          # belt-and-braces fallback.
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload auto-update metadata
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist-metadata
          path: dist/latest.yml
          if-no-files-found: warn
