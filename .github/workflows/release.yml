name: Release

on:
  push:
    tags:
      # Desktop-app installer releases (e.g. `kiyeovo-1.0.0`). Infra-bundle
      # releases use plain `v*` tags (published manually) and must NOT trigger
      # this workflow, so this is scoped to the `kiyeovo-*` prefix to keep the
      # two release trains separate.
      - "kiyeovo-*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: bash scripts/download-tor.sh linux-x64
      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: bash scripts/download-tor.sh darwin-arm64
      - run: bash scripts/download-tor.sh darwin-x64
      - run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Download bundled Tor (win32-x64)
        shell: bash
        run: bash scripts/download-tor.sh win32-x64

      - run: npm run build

      - run: npm run transpile:electron

      - name: Build Windows installers
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload auto-update metadata
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist-metadata
          path: dist/latest.yml
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/kiyeovo-')
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-mac
      - build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # Derive a friendly release title from the tag: kiyeovo-1.0.0 -> "Kiyeovo 1.0.0".
      - id: relver
        run: echo "version=${GITHUB_REF_NAME#kiyeovo-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Kiyeovo ${{ steps.relver.outputs.version }}
          draft: true
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.yml
